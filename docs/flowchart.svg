<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1580" viewBox="0 0 1200 1580" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <style>
    .title{font-size:25px;font-weight:700;fill:#0f172a}.subtitle{font-size:13px;fill:#475569}.lane{font-size:15px;font-weight:700;fill:#fff;letter-spacing:.3px}
    .box{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.7;filter:url(#shadow)}.db{fill:#ecfeff;stroke:#0891b2;stroke-width:1.7;filter:url(#shadow)}
    .decision{fill:#fffbeb;stroke:#d97706;stroke-width:1.7;filter:url(#shadow)}.on{fill:#ecfdf5;stroke:#16a34a;stroke-width:1.7;filter:url(#shadow)}
    .off{fill:#fef2f2;stroke:#dc2626;stroke-width:1.7;filter:url(#shadow)}.hold{fill:#f8fafc;stroke:#64748b;stroke-width:1.7;filter:url(#shadow)}
    .manual{fill:#faf5ff;stroke:#9333ea;stroke-width:1.7;filter:url(#shadow)}.safety{fill:#fff7ed;stroke:#ea580c;stroke-width:1.7;filter:url(#shadow)}
    .terminal{fill:#1e3a5f;stroke:#1e3a5f;stroke-width:1.7;filter:url(#shadow)}.t{font-size:14px;fill:#0f172a}.tb{font-size:14px;font-weight:700;fill:#0f172a}
    .tw{font-size:14px;font-weight:700;fill:#fff}.small{font-size:12px;fill:#475569}.yes{font-size:12px;font-weight:700;fill:#15803d}.no{font-size:12px;font-weight:700;fill:#b91c1c}
    .line{stroke:#334155;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.dash{stroke:#7c3aed;stroke-width:1.7;fill:none;stroke-dasharray:7 5;marker-end:url(#arrow)}
    .return{stroke:#0891b2;stroke-width:1.7;fill:none;stroke-dasharray:6 5;marker-end:url(#arrow)}
  </style>
  <rect width="1200" height="1580" fill="#fff"/>
  <text x="40" y="42" class="title">Smart-farm sensing and irrigation control</text>
  <text x="40" y="65" class="subtitle">Current implementation · ESP32 USB serial node · Raspberry Pi Flask/MySQL · dashboard manual control</text>

  <rect x="30" y="88" width="350" height="34" rx="7" fill="#2563eb"/><text x="205" y="110" text-anchor="middle" class="lane">ESP32 SENSOR NODE</text>
  <rect x="425" y="88" width="350" height="34" rx="7" fill="#0f766e"/><text x="600" y="110" text-anchor="middle" class="lane">RASPBERRY PI + MYSQL</text>
  <rect x="820" y="88" width="350" height="34" rx="7" fill="#7e22ce"/><text x="995" y="110" text-anchor="middle" class="lane">DASHBOARD / OPERATOR</text>

  <rect x="80" y="148" width="250" height="54" rx="27" class="terminal"/><text x="205" y="181" text-anchor="middle" class="tw">Every 60 seconds</text>
  <path d="M205 202V232" class="line"/>
  <rect x="45" y="233" width="320" height="90" rx="8" class="box"/>
  <text x="205" y="258" text-anchor="middle" class="tb">Read six sensor channels</text><text x="205" y="280" text-anchor="middle" class="small">temperature · humidity · light</text><text x="205" y="299" text-anchor="middle" class="small">soil moisture · water level · rainfall</text>
  <path d="M205 323V353" class="line"/>
  <rect x="45" y="354" width="320" height="76" rx="8" class="box"/><text x="205" y="379" text-anchor="middle" class="tb">Print one JSON line per reading</text><text x="205" y="401" text-anchor="middle" class="small">position + sensor type + value</text><text x="205" y="418" text-anchor="middle" class="small">USB serial · 9600 baud</text>
  <path d="M365 392H462" class="line"/>
  <rect x="463" y="354" width="275" height="76" rx="8" class="box"/><text x="600" y="379" text-anchor="middle" class="tb">Parse and validate JSON</text><text x="600" y="401" text-anchor="middle" class="small">farm/node_serial.py</text><text x="600" y="418" text-anchor="middle" class="small">range and field validation</text>
  <path d="M600 430V465" class="line"/>
  <polygon points="600,466 710,510 600,554 490,510" class="decision"/><text x="600" y="515" text-anchor="middle" class="t">Reading valid?</text>
  <path d="M710 510H862" class="line"/><text x="742" y="500" class="no">NO</text>
  <rect x="864" y="478" width="280" height="64" rx="8" class="off"/><text x="1004" y="503" text-anchor="middle" class="tb">Record rejection</text><text x="1004" y="525" text-anchor="middle" class="small">never insert a fake sensor value</text>
  <path d="M600 554V590" class="line"/><text x="614" y="578" class="yes">YES</text>
  <rect x="455" y="591" width="290" height="82" rx="8" class="db"/><text x="600" y="617" text-anchor="middle" class="tb">Insert one sensor_data row</text><text x="600" y="639" text-anchor="middle" class="small">MySQL assigns id and created_at</text><text x="600" y="657" text-anchor="middle" class="small">update latest in-memory snapshot</text>
  <path d="M600 673V713" class="line"/>

  <rect x="850" y="148" width="290" height="72" rx="8" class="manual"/><text x="995" y="174" text-anchor="middle" class="tb">Operator presses Pump On/Off</text><text x="995" y="196" text-anchor="middle" class="small">POST /pump/on or /pump/off</text>
  <path d="M995 220V252" class="dash"/>
  <rect x="850" y="253" width="290" height="78" rx="8" class="manual"/><text x="995" y="278" text-anchor="middle" class="tb">Apply command immediately</text><text x="995" y="300" text-anchor="middle" class="small">send PUMP_ON or PUMP_OFF</text><text x="995" y="317" text-anchor="middle" class="small">pause automation for 120 s</text>
  <path d="M850 292H805V1459H770" class="dash"/>

  <rect x="480" y="714" width="240" height="52" rx="26" class="terminal"/><text x="600" y="746" text-anchor="middle" class="tw">Automation tick · 60 seconds</text>
  <path d="M600 766V798" class="line"/>
  <polygon points="600,799 725,844 600,889 475,844" class="decision"/><text x="600" y="840" text-anchor="middle" class="t">Fresh reading available?</text><text x="600" y="858" text-anchor="middle" class="small">age ≤ 180 seconds</text>
  <path d="M725 844H857" class="line"/><text x="750" y="834" class="no">NO</text>
  <rect x="860" y="809" width="280" height="70" rx="8" class="off"/><text x="1000" y="836" text-anchor="middle" class="tb">Fail safe</text><text x="1000" y="858" text-anchor="middle" class="small">stop if running; otherwise hold</text>
  <path d="M600 889V922" class="line"/><text x="614" y="910" class="yes">YES</text>
  <polygon points="600,923 725,968 600,1013 475,968" class="decision"/><text x="600" y="964" text-anchor="middle" class="t">Manual override active?</text><text x="600" y="982" text-anchor="middle" class="small">120-second window</text>
  <path d="M725 968H857" class="line"/><text x="750" y="958" class="yes">YES</text>
  <rect x="860" y="936" width="280" height="64" rx="8" class="hold"/><text x="1000" y="962" text-anchor="middle" class="tb">Hold operator state</text><text x="1000" y="983" text-anchor="middle" class="small">automation sends no command</text>
  <path d="M600 1013V1046" class="line"/><text x="614" y="1035" class="no">NO</text>
  <polygon points="600,1047 725,1092 600,1137 475,1092" class="decision"/><text x="600" y="1097" text-anchor="middle" class="t">Moisture &lt; 30%?</text>

  <path d="M475 1092H350V1170" class="line"/><text x="422" y="1082" class="yes">YES</text>
  <polygon points="350,1171 455,1210 350,1249 245,1210" class="decision"/><text x="350" y="1207" text-anchor="middle" class="t">Stopped and rested</text><text x="350" y="1225" text-anchor="middle" class="small">at least 60 seconds?</text>
  <path d="M350 1249V1292" class="line"/><text x="362" y="1276" class="yes">YES</text>
  <rect x="230" y="1293" width="240" height="65" rx="8" class="on"/><text x="350" y="1319" text-anchor="middle" class="tb">Send PUMP_ON</text><text x="350" y="1341" text-anchor="middle" class="small">soil is dry</text>
  <path d="M455 1210H500V1293" class="line"/><text x="465" y="1200" class="no">NO</text>
  <path d="M600 1137V1170" class="line"/><text x="614" y="1158" class="no">NO</text>
  <polygon points="650,1171 760,1210 650,1249 540,1210" class="decision"/><text x="650" y="1215" text-anchor="middle" class="t">Moisture &gt; 45%?</text>
  <path d="M760 1210H857" class="line"/><text x="788" y="1200" class="yes">YES</text>
  <rect x="860" y="1178" width="280" height="64" rx="8" class="off"/><text x="1000" y="1204" text-anchor="middle" class="tb">Send PUMP_OFF if running</text><text x="1000" y="1225" text-anchor="middle" class="small">target moisture reached</text>
  <path d="M650 1249V1292" class="line"/><text x="662" y="1277" class="no">NO</text>
  <rect x="500" y="1293" width="300" height="65" rx="8" class="hold"/><text x="650" y="1319" text-anchor="middle" class="tb">Hold current state</text><text x="650" y="1341" text-anchor="middle" class="small">hysteresis / already running / resting</text>

  <path d="M350 1358V1400H600V1422" class="line"/><path d="M650 1358V1422" class="line"/><path d="M1000 1242V1400H600" class="line"/>
  <rect x="430" y="1423" width="340" height="72" rx="8" class="box"/><text x="600" y="1449" text-anchor="middle" class="tb">ESP32 drives GPIO 25 → relay → pump</text><text x="600" y="1471" text-anchor="middle" class="small">reports pump state over the same USB link</text>
  <path d="M770 1475H1160V360H995V331" class="return"/>
  <rect x="45" y="1409" width="320" height="86" rx="8" class="safety"/><text x="205" y="1435" text-anchor="middle" class="tb">Independent safety cutoff</text><text x="205" y="1457" text-anchor="middle" class="small">ESP32 turns pump off after 10 seconds</text><text x="205" y="1476" text-anchor="middle" class="small">even if the Pi or dashboard fails</text>
  <path d="M365 1452H430" class="line"/>
  <path d="M600 1495V1522" class="line"/>
  <rect x="450" y="1523" width="300" height="44" rx="22" class="terminal"/><text x="600" y="1551" text-anchor="middle" class="tw">Log decision and continue</text>
  <text x="842" y="1531" class="small">Solid: sensor and automation path</text><text x="842" y="1550" class="small" fill="#7c3aed">Purple dashed: manual command</text><text x="842" y="1569" class="small" fill="#0891b2">Teal dashed: pump status return</text>
</svg>
